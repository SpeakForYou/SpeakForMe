<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SpeakForMe Pro | Mobile AI</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="Weblogo.jpg" type="image/png">
</head>
<body>

<header>
    <div class="logo-container">
        <img src="Logo.png" alt="Logo" class="header-logo" id="appLogo">
    </div>
    <button class="icon-btn" onclick="toggleSettings()">⚙️</button>
</header>

<div class="container">
    <div id="settings" class="panel hidden glass">
        <h3>Settings</h3>
        <div class="setting-item">
            <label>🎤 Voice</label>
            <select id="voiceSelect"></select>
        </div>
        
        <div class="setting-item">
            <label>🔠 Font Size</label>
            <input type="range" min="14" max="30" value="18" id="fontSlider" oninput="setFont(this.value)">
        </div>

        <div class="setting-grid">
            <div class="setting-item">
                <label>⏩ Speed</label>
                <input type="range" min="0.5" max="2" step="0.1" value="1" id="rateSlider">
            </div>
            <div class="setting-item">
                <label>🎼 Pitch</label>
                <input type="range" min="0" max="2" step="0.1" value="1" id="pitchSlider">
            </div>
        </div>

        <div class="setting-row">
            <label>🧹 Auto-Clear</label>
            <input type="checkbox" id="autoClear">
        </div>
        
        <div class="setting-item">
            <label>🎨 Theme</label>
            <select onchange="setTheme(this.value)" id="themeSelect">
                <option value="dark">Dark</option>
                <option value="light">Light</option>
            </select>
        </div>
    </div>

    <div class="prediction-wrapper">
        <div class="prediction-bar">
            <button class="chip" onclick="addText('I want ')">I want</button>
            <button class="chip" onclick="addText('Please ')">Please</button>
            <button class="chip" onclick="addText('Help ')">Help</button>
            <button class="chip" onclick="addText('Where ')">Where</button>
            <button class="chip" onclick="addText('Can you ')">Can you</button>
        </div>
    </div>

    <div class="card main-input-card glass">
        <textarea id="textInput" placeholder="Type here..." rows="2"></textarea>
        
        <div class="button-group">
            <button class="primary-btn" onclick="speakInput()">🔊 SPEAK</button>
            <button class="fav-btn" onclick="saveToFav()">⭐</button>
        </div>
    </div>

    <section>
        <h3>Emoji Talk</h3>
        <div class="emoji-grid">
            <div class="emoji-item glass" onclick="speak('I love this!')">❤️</div>
            <div class="emoji-item glass" onclick="speak('I am hungry')">😋</div>
            <div class="emoji-item glass" onclick="speak('No, stop')">🚫</div>
            <div class="emoji-item glass" onclick="speak('Happy')">😊</div>
            <div class="emoji-item glass" onclick="speak('Tired')">😴</div>
        </div>
    </section>

    <div class="lists-wrapper">
        <section id="favSection">
            <h3>Favorites</h3>
            <div id="favorites" class="horizontal-list"></div>
        </section>

        <section>
            <h3>History</h3>
            <div id="history" class="history-list"></div>
        </section>
    </div>
</div>

<script src="scripts.js"></script>
</body>
</html>
